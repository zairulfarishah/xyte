<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Dashboard — Bento (soft)</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
<style>
  :root{--ink:#0f172a;--ink-2:#334155;--muted:#64748b;--faint:#94a3b8;--line:#e2e8f0;--line-2:#f1f5f9;--bg:#eef3f8;
    --g-blue:linear-gradient(135deg,color-mix(in srgb,#60a5fa 80%,#64748b),color-mix(in srgb,#2563eb 80%,#64748b));--g-red:linear-gradient(135deg,color-mix(in srgb,#fb7185 80%,#64748b),color-mix(in srgb,#e11d48 80%,#64748b));--g-amber:linear-gradient(135deg,color-mix(in srgb,#fbbf24 80%,#64748b),color-mix(in srgb,#f97316 80%,#64748b));
    --g-green:linear-gradient(135deg,color-mix(in srgb,#4ade80 80%,#64748b),color-mix(in srgb,#059669 80%,#64748b));--g-violet:linear-gradient(135deg,color-mix(in srgb,#a78bfa 80%,#64748b),color-mix(in srgb,#6d28d9 80%,#64748b));--g-teal:linear-gradient(135deg,color-mix(in srgb,#2dd4bf 80%,#64748b),color-mix(in srgb,#0891b2 80%,#64748b));
    --shadow:0 1px 2px rgba(15,23,42,.04),0 10px 30px rgba(15,23,42,.06)}
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;font-size:14px}
  button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}

  .chooser{position:sticky;top:0;z-index:60;background:rgba(2,6,23,.77);backdrop-filter:blur(8px)}
  .chooser-in{max-width:1320px;margin:0 auto;padding:10px 16px;display:flex;gap:6px;align-items:center;overflow-x:auto}
  .chooser .lab{font-size:12px;font-weight:800;color:#94a3b8;margin-right:8px;white-space:nowrap}
  .opt{padding:7px 12px;border-radius:8px;font-size:13px;font-weight:600;color:#94a3b8;white-space:nowrap}
  .opt:hover{color:#fff}.opt.on{background:linear-gradient(135deg,color-mix(in srgb,#3b82f6 80%,#64748b),color-mix(in srgb,#7c3aed 80%,#64748b));color:#fff}
  .opt b{opacity:.6;margin-right:6px}
  .concept{display:none}.concept.on{display:block}
  .note{max-width:1320px;margin:14px auto 14px;padding:0 16px;font-size:13px;color:var(--ink-2);line-height:1.55}
  @media(min-width:900px){.note{padding:0 32px}}
  .note div{background:#fff;border:1px dashed #94a3b8;border-radius:12px;padding:10px 14px}

  /* shared */
  .wrap{max-width:1320px;margin:0 auto;padding:0 16px 70px}
  @media(min-width:900px){.wrap{padding:0 32px 80px}}
  .hero{background:radial-gradient(circle at 15% 0%,rgba(59,130,246,.28),transparent 40%),radial-gradient(circle at 85% 10%,rgba(168,85,247,.20),transparent 40%),radial-gradient(circle at 60% 120%,rgba(14,165,233,.16),transparent 45%),#071226;color:#fff}
  .hero-in{max-width:1320px;margin:0 auto;padding:26px 16px 90px}
  @media(min-width:900px){.hero-in{padding:30px 32px 96px}}
  .hero .eyebrow{font-size:12px;font-weight:700;color:#93c5fd;letter-spacing:.08em;text-transform:uppercase}
  .hero h1{font-size:30px;font-weight:900;letter-spacing:-.03em;margin-top:6px}
  .hero h1 span{background:linear-gradient(90deg,color-mix(in srgb,#60a5fa 80%,#64748b),color-mix(in srgb,#c084fc 80%,#64748b),color-mix(in srgb,#f472b6 80%,#64748b));-webkit-background-clip:text;background-clip:text;color:transparent}
  .hero p{color:#94a3b8;font-size:14px;margin-top:6px}
  .card{background:#fff;border-radius:18px;box-shadow:var(--shadow);border:1px solid rgba(226,232,240,.64)}
  .card-h{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:16px 18px 8px}
  .card-h h3{font-size:15px;font-weight:800;display:flex;align-items:center;gap:8px}
  .card-h h3 .ic{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;color:#fff;font-size:14px}
  .card-h a{font-size:12.5px;font-weight:700;color:#2563eb;text-decoration:none}
  .av{width:30px;height:30px;border-radius:50%;display:inline-grid;place-items:center;color:#fff;font-size:11px;font-weight:800;overflow:hidden;flex-shrink:0;border:2px solid #fff}
  .av img{width:100%;height:100%;object-fit:cover}
  .stack{display:flex}.stack .av{margin-left:-8px}.stack .av:first-child{margin-left:0}
  .pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:800;padding:3px 9px;border-radius:999px;white-space:nowrap}
  .empty{padding:16px 18px;color:var(--faint);font-size:13px}
  .num{font-variant-numeric:tabular-nums}
  .kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-top:-64px;position:relative}
  @media(min-width:900px){.kpis{grid-template-columns:repeat(4,1fr)}}
  .kpi{border-radius:18px;padding:18px;color:#fff;position:relative;overflow:hidden;box-shadow:0 14px 30px -10px var(--glow)}
  .kpi::after{content:'';position:absolute;right:-30px;top:-30px;width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.14)}
  .kpi small{font-size:12px;font-weight:700;opacity:.9;text-transform:uppercase;letter-spacing:.05em}
  .kpi b{display:block;font-size:34px;font-weight:900;letter-spacing:-.03em;margin-top:6px;line-height:1}
  .kpi span{display:block;font-size:12.5px;opacity:.9;margin-top:6px;font-weight:600}
  .kpi .ico{position:absolute;right:16px;top:16px;font-size:22px;opacity:.9;z-index:1}

  /* site card with type gradient */
  .scard{border-radius:16px;overflow:hidden;background:#fff;border:1px solid var(--line);display:flex;flex-direction:column}
  .scard .top{padding:14px 16px;color:#fff;background:var(--tg);position:relative}
  .scard .top small{font-size:11px;font-weight:800;opacity:.85;text-transform:uppercase;letter-spacing:.05em}
  .scard .top b{display:block;font-size:16px;font-weight:800;margin-top:4px;line-height:1.25}
  .scard .top span{display:block;font-size:12.5px;opacity:.85;margin-top:2px}
  .scard .bot{padding:12px 16px;display:flex;flex-direction:column;gap:8px}
  .person{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;padding:3px 10px 3px 3px;border-radius:999px;background:var(--line-2)}
  .person .av{width:24px;height:24px;font-size:9px;border-width:0}
  .person.pic{background:#fef3c7;color:#92400e}
  .nocrew{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:800;color:#be123c;background:#ffe4e6;border-radius:999px;padding:5px 12px}

  /* to-do row */
  .todo{display:flex;gap:12px;align-items:center;padding:12px 18px;border-top:1px solid var(--line-2)}
  .todo:first-child{border-top:0}
  .todo .ti{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;color:#fff;font-size:17px;flex-shrink:0;background:var(--tg);box-shadow:0 8px 16px -8px var(--glow)}
  .todo .main{flex:1;min-width:0}
  .todo b{font-weight:700;font-size:13.5px}
  .todo .sub{font-size:12.5px;color:var(--muted);margin-top:2px}
  .todo .go{font-size:12px;font-weight:800;color:#fff;background:var(--tg);border-radius:9px;padding:7px 11px;white-space:nowrap}

  /* summary row — same six cards as the current dashboard */
  .kstrip{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-top:-64px;position:relative}
  @media(min-width:700px){.kstrip{grid-template-columns:repeat(3,1fr)}}
  @media(min-width:1200px){.kstrip{grid-template-columns:repeat(6,1fr)}}
  .kc{background:#fff;border-radius:16px;padding:16px 18px;border:1px solid rgba(226,232,240,.72);border-top:3px solid var(--kc);box-shadow:0 1px 2px rgba(15,23,42,.04),0 12px 28px -12px rgba(15,23,42,.14);cursor:pointer;transition:transform .15s,box-shadow .15s;position:relative;overflow:hidden}
  .kc:hover{transform:translateY(-3px);box-shadow:0 18px 34px -14px var(--kc)}
  .kc::after{content:'';position:absolute;right:-40px;top:-40px;width:110px;height:110px;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--kc) 16%,transparent),transparent 70%)}
  .kc .top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;position:relative;z-index:1}
  .kc small{font-size:11px;font-weight:800;letter-spacing:.08em;color:#64748b;text-transform:uppercase}
  .kc .ico{width:32px;height:32px;border-radius:10px;background:var(--kg);display:grid;place-items:center;color:#fff;font-size:14px;box-shadow:0 8px 16px -6px var(--kc);flex-shrink:0}
  .kc b{display:block;font-size:40px;font-weight:900;letter-spacing:-.04em;margin:12px 0 12px;line-height:1;color:#0f172a}
  .kc .tr{border-top:1px solid #eef2f6;padding-top:11px;font-size:12.5px;font-weight:700;color:var(--kc);display:flex;gap:7px;align-items:center}
  .kc .tr::before{content:'';width:7px;height:7px;border-radius:50%;background:var(--kc);flex-shrink:0}
  .kstrip.dark{margin-top:22px}
  .kstrip.dark .kc{background:linear-gradient(180deg,rgba(255,255,255,.07),rgba(255,255,255,.02));border-color:rgba(255,255,255,.08);border-top:3px solid var(--kc);box-shadow:0 0 22px -10px var(--kc)}
  .kstrip.dark .kc small{color:#94a3b8}
  .kstrip.dark .kc b{color:#fff;text-shadow:0 0 22px var(--kc)}
  .kstrip.dark .kc .tr{border-top-color:rgba(255,255,255,.08)}
  .after-strip{margin-top:18px!important}

  /* leave list — real leave only, never the Saturday rota */
  .lv{display:flex;gap:12px;align-items:center;padding:11px 18px;border-top:1px solid var(--line-2)}
  .lv:first-child{border-top:0}
  .lv .main{flex:1;min-width:0}
  .lv b{font-size:13.5px;font-weight:800}
  .lv small{display:block;font-size:12px;color:var(--muted);margin-top:1px}
  .lt{font-size:11px;font-weight:900;padding:4px 9px;border-radius:8px;letter-spacing:.03em;white-space:nowrap}
  .lw{font-size:11.5px;font-weight:800;padding:4px 10px;border-radius:999px;white-space:nowrap;background:var(--line-2);color:var(--ink-2)}
  .lw.now{background:linear-gradient(135deg,color-mix(in srgb,#fb7185 80%,#64748b),color-mix(in srgb,#e11d48 80%,#64748b));color:#fff;box-shadow:0 6px 14px -6px rgba(225,29,72,.48)}
  .lv-sum{display:flex;gap:8px;flex-wrap:wrap;padding:0 18px 10px}
  .night .lv{border-top-color:rgba(255,255,255,.06)}
  .night .lv b{color:#fff}
  .night .lv small{color:#94a3b8}
  .night .lw{background:rgba(255,255,255,.08);color:#cbd5e1}
  .tile .lv{background:rgba(255,255,255,.14);border-radius:12px;border-top:0;padding:9px 11px;margin-top:8px}
  .tile .lv small{color:rgba(255,255,255,.85)}
  .tile .lw{background:rgba(255,255,255,.22);color:#fff}
  .tile .lw.now{background:#fff;color:#be123c}

  /* 1 · command center */
  .cc{display:grid;grid-template-columns:1fr;gap:18px;margin-top:20px;align-items:start}
  @media(min-width:1050px){.cc{grid-template-columns:minmax(0,1.5fr) minmax(0,1fr)}}
  .sgrid{display:grid;grid-template-columns:1fr;gap:12px;padding:6px 18px 18px}
  @media(min-width:700px){.sgrid{grid-template-columns:repeat(2,1fr)}}
  .tl{padding:6px 18px 18px}
  .tl .d{display:flex;gap:14px;padding:10px 0;border-bottom:1px dashed var(--line)}
  .tl .d:last-child{border-bottom:0}
  .tl .date{width:46px;text-align:center;flex-shrink:0;border-radius:12px;padding:6px 0;background:var(--line-2)}
  .tl .date small{display:block;font-size:10px;font-weight:800;color:var(--muted);text-transform:uppercase}
  .tl .date b{font-size:18px;font-weight:900}
  .tl .jobs{flex:1;display:flex;flex-direction:column;gap:6px;justify-content:center}
  .tl .job{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 12px;border-radius:12px;background:var(--tt);border-left:4px solid var(--tc)}
  .tl .job b{font-size:13px;font-weight:700}
  .tl .job small{display:block;font-size:11.5px;color:var(--muted)}
  .whobar{display:flex;gap:16px;flex-wrap:wrap;padding:4px 18px 16px;font-size:12.5px;font-weight:700;color:var(--ink-2)}
  .whobar span{display:inline-flex;align-items:center;gap:8px}

  /* 2 · bento */
  .bento{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-top:-64px;position:relative}
  @media(min-width:1000px){.bento{grid-template-columns:repeat(4,1fr);grid-auto-rows:minmax(150px,auto)}}
  .tile{border-radius:22px;padding:20px;position:relative;overflow:hidden;box-shadow:var(--shadow)}
  .tile.dark{background:#0f172a;color:#fff}
  .tile.c{color:#fff}
  .tile h4{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;opacity:.85}
  .tile .big{font-size:44px;font-weight:900;letter-spacing:-.04em;line-height:1;margin-top:8px}
  .tile .big small{font-size:16px;opacity:.7;font-weight:700;letter-spacing:0}
  .tile p{font-size:13px;opacity:.9;margin-top:6px;line-height:1.5}
  .tile.w2{grid-column:span 2}.tile.h2{grid-row:span 2}
  .tile .glow{position:absolute;width:200px;height:200px;border-radius:50%;filter:blur(40px);opacity:.35;right:-60px;top:-60px}
  .tile .list{margin-top:12px;display:flex;flex-direction:column;gap:8px;position:relative}
  .tile .li{display:flex;gap:10px;align-items:center;background:rgba(255,255,255,.14);border-radius:12px;padding:9px 11px;font-size:13px}
  .tile .li b{font-weight:700}
  .tile .li small{display:block;font-size:11.5px;opacity:.8}
  .tile.white{background:#fff}
  .tile.white .li{background:var(--line-2)}
  .ring{width:120px;height:120px;border-radius:50%;display:grid;place-items:center;margin:10px auto 0;background:conic-gradient(var(--rc) calc(var(--p)*1%),rgba(255,255,255,.12) 0)}
  .ring div{width:92px;height:92px;border-radius:50%;background:#0f172a;display:grid;place-items:center;text-align:center}
  .ring b{font-size:26px;font-weight:900;display:block;line-height:1}
  .ring small{font-size:11px;opacity:.7}
  .bars{display:flex;align-items:flex-end;gap:8px;height:110px;margin-top:14px}
  .bars div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:5px;height:100%;font-size:11px;font-weight:800;opacity:.9}
  .bars i{width:100%;border-radius:8px 8px 4px 4px;background:linear-gradient(180deg,color-mix(in srgb,#a78bfa 80%,#64748b),color-mix(in srgb,#6366f1 80%,#64748b));min-height:4px}
  .bars div.today i{background:linear-gradient(180deg,color-mix(in srgb,#fbbf24 80%,#64748b),color-mix(in srgb,#f97316 80%,#64748b))}

  /* 3 · team pulse */
  .pulse{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px;margin-top:-64px;position:relative}
  .pcard{background:#fff;border-radius:20px;padding:18px 14px;text-align:center;box-shadow:var(--shadow);position:relative;overflow:hidden}
  .pcard::before{content:'';position:absolute;inset:0 0 auto 0;height:54px;background:var(--sg);opacity:.95}
  .pcard .ph{position:relative;width:72px;height:72px;margin:0 auto;border-radius:50%;padding:4px;background:var(--sg)}
  .pcard .ph .av{width:64px;height:64px;font-size:20px;border:3px solid #fff}
  .pcard b{display:block;font-size:14px;font-weight:800;margin-top:10px}
  .pcard .st{display:inline-block;margin-top:6px;font-size:11px;font-weight:800;padding:3px 10px;border-radius:999px;color:#fff;background:var(--sg)}
  .pcard .where{font-size:12px;color:var(--muted);margin-top:6px;line-height:1.4;min-height:34px}
  .p2{display:grid;grid-template-columns:1fr;gap:18px;margin-top:20px;align-items:start}
  @media(min-width:1050px){.p2{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}}
  .legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;font-weight:700;color:var(--ink-2);margin:18px 2px 0}
  .legend span{display:inline-flex;gap:7px;align-items:center}
  .legend i{width:14px;height:14px;border-radius:50%;background:var(--sg)}

  /* 4 · night mode */
  .night{background:#020617;color:#e2e8f0;min-height:100vh}
  .night .wrap{padding-top:26px}
  .night h1{font-size:30px;font-weight:900;letter-spacing:-.03em}
  .night h1 span{background:linear-gradient(90deg,color-mix(in srgb,#22d3ee 80%,#64748b),color-mix(in srgb,#a78bfa 80%,#64748b),color-mix(in srgb,#f472b6 80%,#64748b));-webkit-background-clip:text;background-clip:text;color:transparent}
  .night .sub{color:#64748b;margin-top:4px}
  .nk{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-top:22px}
  @media(min-width:900px){.nk{grid-template-columns:repeat(4,1fr)}}
  .nkpi{border-radius:18px;padding:18px;background:linear-gradient(180deg,rgba(255,255,255,.06),rgba(255,255,255,.02));border:1px solid rgba(255,255,255,.08);position:relative;overflow:hidden}
  .nkpi::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--nc);box-shadow:0 0 18px var(--nc)}
  .nkpi small{font-size:12px;color:#94a3b8;font-weight:700;text-transform:uppercase;letter-spacing:.05em}
  .nkpi b{display:block;font-size:34px;font-weight:900;margin-top:6px;color:#fff;text-shadow:0 0 24px var(--nc)}
  .nkpi span{font-size:12.5px;color:#94a3b8}
  .npanel{border-radius:20px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);margin-top:18px}
  .npanel .card-h h3{color:#fff}
  .nweek{display:grid;grid-template-columns:repeat(7,minmax(140px,1fr));gap:10px;padding:8px 18px 18px;min-width:1050px}
  .nday{border-radius:14px;padding:10px;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.06);min-height:190px}
  .nday.today{border-color:#22d3ee;box-shadow:0 0 0 1px #22d3ee,0 0 24px -6px #22d3ee}
  .nday .h{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
  .nday .h b{font-size:20px;font-weight:900;color:#fff}
  .nday .h small{font-size:11px;font-weight:800;color:#64748b;text-transform:uppercase}
  .njob{border-radius:10px;padding:8px 9px;margin-bottom:6px;background:color-mix(in srgb,var(--nc) 18%,transparent);border:1px solid color-mix(in srgb,var(--nc) 45%,transparent)}
  .njob b{font-size:12px;font-weight:800;color:#fff;display:block;line-height:1.3}
  .njob small{font-size:11px;color:#cbd5e1}
  .njob.bad{--nc:color-mix(in srgb,#f43f5e 80%,#64748b)}
  .nfree{font-size:11px;color:#64748b;margin-top:6px;line-height:1.5}
  .nfree b{color:#94a3b8}
  .nalerts{display:flex;flex-wrap:wrap;gap:10px;padding:6px 18px 18px}
  .nalert{display:flex;gap:10px;align-items:center;border-radius:14px;padding:10px 14px;background:color-mix(in srgb,var(--nc) 14%,transparent);border:1px solid color-mix(in srgb,var(--nc) 40%,transparent);font-size:13px;color:#fff;flex:1 1 280px}
  .nalert small{display:block;color:#94a3b8;font-size:12px}
  .nalert .d{width:10px;height:10px;border-radius:50%;background:var(--nc);box-shadow:0 0 12px var(--nc);flex-shrink:0}

  /* 5 · stacked app cards */
  .app{max-width:1320px;margin:0 auto;padding:0 16px 70px}
  @media(min-width:900px){.app{padding:0 32px 80px}}
  .agrid{display:grid;grid-template-columns:1fr;gap:16px;margin-top:-64px;position:relative}
  @media(min-width:1000px){.agrid{grid-template-columns:repeat(3,1fr)}}
  .acard{border-radius:24px;padding:20px;color:#fff;position:relative;overflow:hidden;box-shadow:0 20px 40px -18px var(--glow)}
  .acard::after{content:'';position:absolute;inset:auto -40px -60px auto;width:180px;height:180px;border-radius:50%;background:rgba(255,255,255,.12)}
  .acard h4{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.07em;opacity:.85;display:flex;justify-content:space-between}
  .acard .t{font-size:22px;font-weight:900;letter-spacing:-.02em;margin-top:10px;line-height:1.2}
  .acard .s{font-size:13px;opacity:.9;margin-top:4px}
  .acard .rows{margin-top:14px;display:flex;flex-direction:column;gap:8px;position:relative;z-index:1}
  .acard .r{background:rgba(255,255,255,.16);border-radius:14px;padding:10px 12px;display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:13px}
  .acard .r b{font-weight:800}
  .acard .r small{display:block;font-size:11.5px;opacity:.85}

const perDay = s => s.a.some(a=>a[2])
function crewOn(s,d){
  const rows = perDay(s) ? s.a.filter(a=>a[2]===d) : s.a.filter(a=>!a[2])

}

  if(jobs.length) return { k:'site', jobs, pic: jobs.some(s=>crewOn(s,d).pic.includes(members[mi])), l:'On site' }

  })

    const pic = crewOn(s,s.end).pic[0]

}

  { l:'Team members',    v:7,   tr:'Active team',       c:'#7c3aed', g:'linear-gradient(135deg,color-mix(in srgb,#a78bfa 80%,#64748b),color-mix(in srgb,#6d28d9 80%,#64748b))', ic:'◈' },
  { l:'Pending reports', v:7,   tr:'7 needs action',    c:'#dc2626', g:'linear-gradient(135deg,color-mix(in srgb,#f87171 80%,#64748b),color-mix(in srgb,#dc2626 80%,#64748b))', ic:'▤' },
]
const kpiStrip = (dark = false) => `<div class="kstrip ${dark?'dark':''}">${KPI.map(k=>`<div class="kc" style="--kc:${k.c};--kg:${k.g}"><div class="top"><small>${k.l}</small><span class="ico">${k.ic}</span></div><b class="num">${k.v}</b><div class="tr">${k.tr}</div></div>`).join('')}</div>`
const kpiTiles = () => `<div class="kpis">
  <div class="kpi" style="background:var(--g-blue);--glow:rgba(37,99,235,.44)"><span class="ico">📍</span><small>Sites today</small><b class="num">${todayJobs.length}</b><span>${todayJobs.map(s=>s.n.split(' ').slice(0,2).join(' ')).join(' · ')||'quiet day'}</span></div>
  <div class="kpi" style="background:var(--g-teal);--glow:rgba(8,145,178,.44)"><span class="ico">👷</span><small>People out</small><b class="num">${onSiteToday}<span style="display:inline;font-size:18px;opacity:.7"> / ${members.length}</span></b><span>${freeToday.length} free at store</span></div>
  <div class="kpi" style="background:${ACTS.length?'var(--g-red)':'var(--g-green)'};--glow:rgba(225,29,72,.40)"><span class="ico">⚡</span><small>Needs action</small><b class="num">${ACTS.length}</b><span>${ACTS.filter(a=>a.sev==='red').length} urgent today</span></div>
  <div class="kpi" style="background:var(--g-violet);--glow:rgba(109,40,217,.40)"><span class="ico">📝</span><small>Reports open</small><b class="num">${reportsOpen}</b><span>${monthDone} of ${monthSites.length} sites done this month</span></div>
</div>`
const siteCard = (s,d) => `<div class="scard" style="--tg:${TYPE[s.type].g}"><div class="top"><small>${TYPE[s.type].ic} ${TYPE[s.type].l} · ${dayLabel(s,d)}</small><b>${esc(s.n)}</b><span>📍 ${esc(place(s))} · ${esc(s.co)||'—'}</span></div><div class="bot"><div style="display:flex;flex-wrap:wrap;gap:6px">${people(crewOn(s,d))}</div></div></div>`

/* 1 · command center */
function r1(){
  const next = Array.from({length:7},(_,i)=>addD(TODAY,i+1)).filter(d=>dow(d)!==0)
  $('#d1').innerHTML = `<div class="note"><div><b>1 · Command Center</b> — the current dashboard's dark header and gradient tiles, but every tile is something you act on. Today's sites as colourful cards with team photos, a to-do list with coloured icons, and a timeline of the next days.</div></div>` + hero(heroSub) + `<div class="wrap">` + kpiStrip() + `
  <div class="cc">
    <div class="card"><div class="card-h"><h3><span class="ic" style="background:var(--g-blue)">📍</span>Today on site</h3><a href="#">Calendar →</a></div>
      <div class="sgrid">${todayJobs.map(s=>siteCard(s,TODAY)).join('') || '<div class="empty">No site work today.</div>'}</div>
      <div class="whobar"><span>🟢 At store: ${freeToday.map(m=>av(m,24)+esc(m.s)).join(' ')||'—'}</span>${awayToday.length?`<span>🔴 Away: ${awayToday.map(m=>av(m,24)+esc(m.s)).join(' ')}</span>`:''}</div>
    </div>
    <div class="card"><div class="card-h"><h3><span class="ic" style="background:var(--g-red)">⚡</span>Needs action</h3><span class="pill" style="background:#ffe4e6;color:#be123c">${ACTS.length}</span></div>
      ${ACTS.map(todoRow).join('') || '<div class="empty">🎉 All clear!</div>'}
    </div>
  </div>
  <div class="cc">
  <div class="card"><div class="card-h"><h3><span class="ic" style="background:var(--g-violet)">🗓</span>Coming up</h3><a href="#">Sites →</a></div>
    <div class="tl">${next.map(d=>{const ss=sitesOn(d);const lv=leaves.filter(l=>l.type!=='OFF DAY'&&d>=l.start&&d<=l.end);return `<div class="d"><div class="date"><small>${DN[dow(d)]}</small><b>${dn(d)}</b></div><div class="jobs">${ss.map(s=>{const c=crewOn(s,d);return `<div class="job" style="--tc:${TYPE[s.type].c};--tt:${TYPE[s.type].t}"><div><b>${esc(s.n)}</b><small>${dayLabel(s,d)} · ${esc(place(s))}</small></div><div class="stack">${c.all.map(m=>av(m,28)).join('')||'<span class="nocrew" style="padding:3px 9px;font-size:11px">No crew</span>'}</div></div>`}).join('')}${lv.map(l=>`<div class="job" style="--tc:#e11d48;--tt:#fff1f2"><div><b>🌴 ${esc(members[l.m].s)} on leave</b><small>${tc(l.type)}</small></div>${av(members[l.m],28)}</div>`).join('')}${!ss.length&&!lv.length?'<span style="color:var(--faint);font-size:13px">Nothing booked</span>':''}</div></div>`}).join('')}</div>
  </div>
  ${leaveCard()}
  </div></div>`
}

/* 2 · bento */
function r2(){
  const loads = weekDates.map(d=>members.filter(m=>statusOf(m.i,d).k==='site').length)
  const max = Math.max(1,...loads)
  const me = members[ME]
  let myNext = null
  for(let i=1;i<=30;i++){ const d=addD(TODAY,i), s=statusOf(ME,d); if(s.k==='site'){ myNext={d,s}; break } }
  const pct = Math.round(onSiteToday/members.length*100)
  $('#d2').innerHTML = `<div class="note"><div><b>2 · Bento</b> — big bold tiles, each answering one question: what's urgent, where's everyone, what's my next job, how busy is the week. Bright gradients, big numbers, nothing filler.</div></div>` + hero(heroSub) + `<div class="wrap">${kpiStrip()}
  <div class="bento after-strip">
    <div class="tile c w2 h2" style="background:var(--g-red)"><div class="glow" style="background:color-mix(in srgb,#fde68a 80%,#64748b)"></div><h4>⚡ Needs action</h4><div class="big">${ACTS.length}</div>
      <div class="list">${ACTS.map(a=>`<div class="li"><span style="font-size:18px">${a.ic}</span><div><b>${esc(a.title)}</b><small>${a.sub}</small></div></div>`).join('') || '<div class="li">🎉 All clear</div>'}</div></div>
    <div class="tile dark"><h4>👷 Team out today</h4><div class="ring" style="--p:${pct};--rc:color-mix(in srgb,#22d3ee 80%,#64748b)"><div><span><b>${onSiteToday}/${members.length}</b><small>on site</small></span></div></div></div>
    <div class="tile c" style="background:var(--g-teal)"><div class="glow" style="background:color-mix(in srgb,#a5f3fc 80%,#64748b)"></div><h4>🟢 Free right now</h4><div class="big">${freeToday.length}</div><div class="stack" style="margin-top:10px">${freeToday.map(m=>av(m,34)).join('')}</div><p>${freeToday.map(m=>m.s).join(', ')}</p></div>
    <div class="tile c w2" style="background:linear-gradient(135deg,color-mix(in srgb,#1e3a8a 80%,#64748b),color-mix(in srgb,#2563eb 80%,#64748b) 55%,color-mix(in srgb,#0891b2 80%,#64748b))"><div class="glow" style="background:color-mix(in srgb,#93c5fd 80%,#64748b)"></div><h4>📍 Today on site</h4>
      <div class="list">${todayJobs.map(s=>{const c=crewOn(s,TODAY);return `<div class="li"><div style="flex:1"><b>${esc(s.n)}</b><small>${dayLabel(s,TODAY)} · ${esc(place(s))}</small></div><div class="stack">${c.all.map(m=>av(m,28)).join('')||'<span class="pill" style="background:#fff;color:#be123c">No crew</span>'}</div></div>`}).join('')||'<div class="li">Quiet day</div>'}</div></div>
    <div class="tile c" style="background:var(--g-violet)"><div class="glow" style="background:color-mix(in srgb,#f0abfc 80%,#64748b)"></div><h4>🎯 Your next job</h4>${myNext?`<div style="font-size:20px;font-weight:900;margin-top:10px;line-height:1.2">${esc(myNext.s.jobs.map(j=>j.n).join(' + '))}</div><p>${rel(myNext.d)}${myNext.s.pic?' · you are PIC':''}</p>`:'<p>Nothing booked</p>'}</div>
    <div class="tile c" style="background:var(--g-amber)"><div class="glow" style="background:color-mix(in srgb,#fef08a 80%,#64748b)"></div><h4>📝 Reports open</h4><div class="big">${reportsOpen}</div><p>${monthDone} of ${monthSites.length} October sites completed</p></div>
    <div class="tile dark w2"><h4>📊 This week · people on site</h4><div class="bars">${weekDates.map((d,i)=>`<div class="${d===TODAY?'today':''}"><span>${loads[i]||''}</span><i style="height:${loads[i]/max*80}%"></i><span style="opacity:.6">${DN[dow(d)]}</span></div>`).join('')}</div></div>
    <div class="tile c w2" style="background:linear-gradient(135deg,color-mix(in srgb,#f472b6 80%,#64748b),color-mix(in srgb,#db2777 80%,#64748b))"><div class="glow" style="background:color-mix(in srgb,#fbcfe8 80%,#64748b)"></div><h4>🌴 Team leave · next 30 days</h4><div class="big">${LEAVE_SOON.length}<small> ${LEAVE_SOON.some(l=>l.start<=TODAY)?'· someone out now':'booked'}</small></div><div style="position:relative">${LEAVE_SOON.map(leaveRow).join('')||'<p>Nobody on leave 🎉</p>'}</div></div>
  </div></div>`
}

/* 3 · team pulse */
function r3(){
  const tmr = addD(TODAY,1)
  $('#d3').innerHTML = `<div class="note"><div><b>3 · Team Pulse</b> — people first. Every team member's photo with a coloured ring for where they are today (blue on site, green free, red leave, grey off), then today's sites and the to-do list underneath.</div></div>` + hero(heroSub) + `<div class="wrap">${kpiStrip()}
  <h3 style="font-size:15px;font-weight:800;margin:22px 2px 0">👥 Team today</h3>
  <div class="pulse after-strip" style="margin-top:12px!important">${members.map((m,i)=>{const s=statusToday[i];return `<div class="pcard" style="--sg:${ST_G[s.k]}"><div class="ph">${av(m)}</div><b>${esc(m.s)}</b><span class="st">${s.k==='site'?(s.pic?'★ PIC':'On site'):s.l}</span><div class="where">${s.k==='site'?esc(s.jobs.map(j=>j.n).join(' + ')):'&nbsp;'}<br><span style="font-size:11px;color:var(--faint)">Tmr: ${esc((x=>x.k==='site'?x.jobs.map(j=>j.n).join(' + '):x.l)(statusOf(m.i,tmr)))}</span></div></div>`}).join('')}</div>
  <div class="legend"><span><i style="--sg:${ST_G.site}"></i>On site</span><span><i style="--sg:${ST_G.free}"></i>Free / store</span><span><i style="--sg:${ST_G.leave}"></i>Leave</span><span><i style="--sg:${ST_G.off}"></i>Off</span></div>
  <div class="p2">
    <div class="card"><div class="card-h"><h3><span class="ic" style="background:var(--g-blue)">📍</span>Today on site</h3><a href="#">Calendar →</a></div><div class="sgrid" style="grid-template-columns:1fr">${todayJobs.map(s=>siteCard(s,TODAY)).join('')||'<div class="empty">No site work today.</div>'}</div></div>
    <div class="card"><div class="card-h"><h3><span class="ic" style="background:var(--g-red)">⚡</span>Needs action</h3><span class="pill" style="background:#ffe4e6;color:#be123c">${ACTS.length}</span></div>${ACTS.map(todoRow).join('')||'<div class="empty">🎉 All clear!</div>'}</div>
  </div>
  <div style="margin-top:18px">${leaveCard()}</div></div>`
}

/* 4 · night ops */
function r4(){
  $('#d4').innerHTML = `<div class="note" style="color:#94a3b8;padding-top:4px"><div style="background:rgba(255,255,255,.04);border-color:#334155"><b style="color:#fff">4 · Night Ops</b> — a dark control-room look with neon accents. Glowing numbers on top, problems as coloured glowing chips, and the whole week as neon cards with crew and who's free. Today is outlined in cyan.</div></div><div class="wrap">
  <h1>Good morning, <span>${members[ME].s}</span></h1><div class="sub">${fmt(TODAY)} 2026 · ${heroSub}</div>
  ${kpiStrip(true)}
  <div class="npanel"><div class="card-h"><h3>⚡ Needs action</h3></div><div class="nalerts">${ACTS.map(a=>`<div class="nalert" style="--nc:${SEV[a.sev].c}"><span class="d"></span><div><b>${esc(a.title)}</b><small>${a.sub}</small></div></div>`).join('')||'<span style="color:#64748b">All clear</span>'}</div></div>
  <div class="npanel"><div class="card-h"><h3>🌴 Team leave</h3><span style="font-size:12px;color:#64748b;font-weight:700">next 30 days · excl. Saturday off</span></div>${LEAVE_SOON.length?`<div class="lv-sum">${leaveSummary()}</div>`:''}${leaveList()}</div>
  <div class="npanel" style="overflow-x:auto"><div class="card-h"><h3>🗓 This week</h3></div><div class="nweek">${weekDates.map(d=>{
    const ss=sitesOn(d), free=dow(d)===0?[]:members.filter(m=>['free','store'].includes(statusOf(m.i,d).k)), away=dow(d)===0?[]:members.filter(m=>['leave','off'].includes(statusOf(m.i,d).k))
    return `<div class="nday ${d===TODAY?'today':''}"><div class="h"><b>${dn(d)}</b><small>${DN[dow(d)]}</small></div>${ss.map(s=>{const c=crewOn(s,d);return `<div class="njob ${c.all.length?'':'bad'}" style="--nc:${TYPE[s.type].c}"><b>${esc(s.n)}</b><small>${c.all.length?c.all.map((m,k)=>(k<c.pic.length?'★':'')+m.s).join(', '):'⚠ no crew'}</small></div>`}).join('')||`<div style="color:#475569;font-size:12px">${dow(d)===0?'Sunday':'No jobs'}</div>`}${dow(d)!==0?`<div class="nfree"><b>Free:</b> ${free.map(m=>m.s).join(', ')||'—'}${away.length?`<br><b>Away:</b> ${away.map(m=>m.s).join(', ')}`:''}</div>`:''}</div>`}).join('')}</div></div>
  </div>`
}

/* 5 · app cards */
function r5(){
  const me = members[ME], st = statusOf(ME,TODAY)
  let myNext = []
  for(let i=1;i<=30 && myNext.length<3;i++){ const d=addD(TODAY,i), s=statusOf(ME,d); if(s.k==='site'){ const key=s.jobs.map(j=>j.i).join(), last=myNext.at(-1); if(last&&last.key===key&&addD(last.to,1)===d){ last.to=d; last.pic=last.pic||s.pic } else myNext.push({key,from:d,to:d,s,pic:s.pic}) } }
  $('#d5').innerHTML = `<div class="note"><div><b>5 · App Cards</b> — big glossy cards like a phone app: your day, what needs action, and today's sites. Below, a colourful week strip (dots = jobs) and the team. Works great on phones — cards just stack.</div></div>` + hero(heroSub) + `<div class="app">${kpiStrip()}
  <div class="agrid after-strip">
    <div class="acard" style="background:var(--g-violet);--glow:rgba(109,40,217,.56)"><h4><span>🎯 Your day</span><span>${esc(me.s)}</span></h4>
      <div class="t">${st.k==='site'?esc(st.jobs.map(j=>j.n).join(' + ')):st.l}</div><div class="s">${st.k==='site'?'You are on site today':'Today'} · ${fmt(TODAY)}</div>
      <div class="rows">${myNext.map(j=>`<div class="r"><div><b>${esc(j.s.jobs.map(x=>x.n).join(' + '))}</b><small>${j.from===j.to?rel(j.from):`${short(j.from)} – ${short(j.to)}`}</small></div>${j.pic?'<span class="pill" style="background:#fff;color:#6d28d9">★ PIC</span>':''}</div>`).join('')||'<div class="r">Nothing booked</div>'}
      ${leaves.filter(l=>l.m===ME&&l.type!=='OFF DAY'&&l.end>=TODAY).map(l=>`<div class="r"><div><b>🌴 ${tc(l.type)}</b><small>${short(l.start)} – ${short(l.end)}</small></div></div>`).join('')}</div></div>
    <div class="acard" style="background:var(--g-red);--glow:rgba(225,29,72,.56)"><h4><span>⚡ Needs action</span><span>${ACTS.length}</span></h4>
      <div class="t">${ACTS.length?`${ACTS.length} thing${ACTS.length===1?'':'s'} to sort`:'All clear 🎉'}</div><div class="s">${ACTS.filter(a=>a.sev==='red').length} urgent today</div>
      <div class="rows">${ACTS.map(a=>`<div class="r"><div><b>${a.ic} ${esc(a.title)}</b><small>${a.sub}</small></div></div>`).join('')}</div></div>
    <div class="acard" style="background:linear-gradient(135deg,color-mix(in srgb,#1e3a8a 80%,#64748b),color-mix(in srgb,#2563eb 80%,#64748b) 55%,color-mix(in srgb,#0891b2 80%,#64748b));--glow:rgba(37,99,235,.56)"><h4><span>📍 Today on site</span><span>${onSiteToday}/${members.length} out</span></h4>
      <div class="t">${todayJobs.length} site${todayJobs.length===1?'':'s'}</div><div class="s">${freeToday.length} free at store${awayToday.length?` · ${awayToday.length} away`:''}</div>
      <div class="rows">${todayJobs.map(s=>{const c=crewOn(s,TODAY);return `<div class="r"><div><b>${esc(s.n)}</b><small>${dayLabel(s,TODAY)} · ${esc(place(s))}</small></div><div class="stack">${c.all.map(m=>av(m,28)).join('')||'<span class="pill" style="background:#fff;color:#be123c">No crew</span>'}</div></div>`}).join('')}</div></div>
  </div>
  <div class="card" style="margin-top:18px"><div class="card-h"><h3><span class="ic" style="background:var(--g-teal)">🗓</span>This week</h3><a href="#">Calendar →</a></div>
    <div class="strip">${weekDates.map(d=>{const ss=sitesOn(d);const out=members.filter(m=>statusOf(m.i,d).k==='site').length;return `<div class="sd ${d===TODAY?'today':''}"><small>${DN[dow(d)]}</small><b>${dn(d)}</b><div class="dots">${ss.map(s=>`<i style="--dc:${crewOn(s,d).all.length?(d===TODAY?'#fff':TYPE[s.type].c):'#f43f5e'}" title="${esc(s.n)}"></i>`).join('')}</div><span>${dow(d)===0?'rest':`${out} out`}</span></div>`}).join('')}</div>
  </div>
  <div style="margin-top:18px">${leaveCard()}</div>
  <div class="card" style="margin-top:18px"><div class="card-h"><h3><span class="ic" style="background:var(--g-green)">👥</span>Team today</h3><a href="#">Team →</a></div>
    <div style="display:flex;flex-wrap:wrap;gap:10px;padding:6px 18px 18px">${members.map((m,i)=>{const s=statusToday[i];return `<span class="person" style="background:${s.k==='site'?'#eff6ff':s.k==='leave'?'#fff1f2':['free','store'].includes(s.k)?'#ecfdf5':'#f1f5f9'};padding:4px 12px 4px 4px">${av(m,28)}<span><b style="font-weight:800">${esc(m.s)}</b><br><small style="font-weight:600;color:var(--muted);font-size:11px">${s.k==='site'?esc(s.jobs.map(j=>j.n).join(' + ')):s.l}</small></span></span>`}).join('')}</div>
  </div></div>`
}

r1(); r2(); r3(); r4(); r5()
document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('.opt').forEach(x=>x.classList.toggle('on',x===b))
  document.querySelectorAll('.concept').forEach(c=>c.classList.toggle('on',c.id==='c'+b.dataset.c))
  window.scrollTo({top:0})
})
</script>
</body>
</html>
